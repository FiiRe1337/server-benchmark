# Portable GUI EXE (PyInstaller onefile) with the REAL core sbench.exe embedded.
# Only callable from other workflows (gui-ci.yml, later release), always after build-windows.yml in the SAME run:
#   gui:
#     needs: core
#     uses: ./.github/workflows/build-gui.yml
#     with: { version: "${{ needs.core.outputs.version }}", core_artifact: "${{ needs.core.outputs.cli_artifact_x64 }}" }
# Output artifact: sbench-gui-x64 with exactly one file sbench-gui.exe (+ separate sbench-gui-selftest-x64 report).
name: GUI-Build (sbench-gui.exe)

on:
  workflow_call:
    inputs:
      version:
        description: "GUI-/Build-Version (normalerweise needs.core.outputs.version)"
        type: string
        required: false
        default: ""
      core_artifact:
        description: "Artifact aus demselben Lauf mit genau einer sbench.exe"
        type: string
        required: false
        default: sbench-cli-x64
    outputs:
      version:
        description: "Version der GUI"
        value: ${{ jobs.gui.outputs.version }}
      core_sha256:
        description: "SHA-256 des eingebetteten sbench.exe"
        value: ${{ jobs.gui.outputs.core_sha256 }}
      exe_sha256:
        description: "SHA-256 der getesteten sbench-gui.exe (release.yml prüft, dass genau diese Datei veröffentlicht wird)"
        value: ${{ jobs.gui.outputs.exe_sha256 }}
      artifact:
        description: "Artifact-Name der GUI-EXE"
        value: sbench-gui-x64

permissions:
  contents: read

# No workflow-level concurrency here: the caller (gui-ci.yml) owns the group. A callee group derived from
# github.workflow would equal the caller's group (github.workflow = caller name under workflow_call) -> deadlock.

jobs:
  gui:
    name: GUI-EXE x64 (PyInstaller, Kern eingebettet)
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.info.outputs.version }}
      core_sha256: ${{ steps.info.outputs.core_sha256 }}
      exe_sha256: ${{ steps.exehash.outputs.exe_sha256 }}
    defaults:
      run:
        shell: pwsh
        working-directory: gui
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe fallback in gen_build_info.py

      - name: Kern-Artifact laden (${{ inputs.core_artifact }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.core_artifact }}
          path: gui/core-download

      - name: Kern prüfen (genau eine sbench.exe)
        run: |
          $f = @(Get-ChildItem -Recurse -File core-download)
          $f | ForEach-Object { "{0}  {1:N0} B" -f $_.FullName, $_.Length }
          if ($f.Count -ne 1 -or $f[0].Name -ne "sbench.exe") { throw "Artifact ${{ inputs.core_artifact }} muss genau sbench.exe enthalten" }
          & $f[0].FullName version --json
          if ($LASTEXITCODE -ne 0) { throw "sbench version --json: Exit $LASTEXITCODE" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            gui/requirements.txt
            gui/requirements-ci.txt

      - name: Abhängigkeiten (gepinnt)
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Build-Info erzeugen (Version, Commit, SHA-256 des Kerns)
        id: info
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          python tools/gen_build_info.py --core core-download\sbench.exe --version "$env:IN_VERSION" --commit "$env:GITHUB_SHA" --run-core
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content sbgui\_build_info.py

      - name: PyInstaller (onefile, windowed)
        run: |
          python -m PyInstaller --noconfirm --clean sbench-gui.spec
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-Item dist\sbench-gui.exe
          "{0}  {1:N0} B ({2:N1} MiB)" -f $exe.FullName, $exe.Length, ($exe.Length / 1MB)
          "## sbench-gui.exe`n`nVersion ${{ steps.info.outputs.version }}, Größe $([math]::Round($exe.Length / 1MB, 1)) MiB, Kern-SHA-256 ``${{ steps.info.outputs.core_sha256 }}``" >> $env:GITHUB_STEP_SUMMARY

      - name: Self-Test der EXE (ohne Admin, echter Kern)
        run: |
          # windowed EXE (console=False): no stdout -> wait for the process and read the --report file.
          # Copy into a fresh dir so data\ (next to the EXE) is created by the GUI itself and the artifact stays one file.
          $st = Join-Path $env:RUNNER_TEMP "gui-selftest"
          New-Item -ItemType Directory -Force $st | Out-Null
          Copy-Item dist\sbench-gui.exe $st
          $report = Join-Path $PWD "build\selftest-exe.json"
          New-Item -ItemType Directory -Force build | Out-Null
          $p = Start-Process -FilePath (Join-Path $st "sbench-gui.exe") -ArgumentList @("--self-test", "--platforms", "windows,offscreen", "--report", "`"$report`"") -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path $report)) { Write-Host "no report written"; exit 1 }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.summary | ForEach-Object { Write-Host $_ }
          "### Self-Test`n``````text`n$($r.summary -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Recurse (Join-Path $st "data\bin") | ForEach-Object { "{0}  {1}" -f $_.FullName, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.frozen -or $r.core.mode -ne "embedded") { Get-Content $report; exit 1 }
          if ($r.core.expected_sha256 -ne "${{ steps.info.outputs.core_sha256 }}") { throw "eingebetteter SHA-256 weicht vom Build ab" }

      - name: Klick-Test der EXE (jeder Button/jede Aktion, echter Kern, Qt-Plattform windows)
        run: |
          # v0.1.0-beta.1 shipped '+ Datei' / '+ Volume' / '+ Disk' without any handler. --self-test-clicks presses every
          # QPushButton/QToolButton/QAction of every page inside the FROZEN app (dialogs auto-answered, no real benchmark run)
          # and fails on dead buttons, exceptions, unconnected page signals or known buttons without a visible reaction.
          $st = Join-Path $env:RUNNER_TEMP "gui-selftest"
          $report = Join-Path $PWD "build\selftest-clicks.json"
          $p = Start-Process -FilePath (Join-Path $st "sbench-gui.exe") -ArgumentList @("--self-test-clicks", "--platforms", "windows", "--report", "`"$report`"") -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path $report)) { Write-Host "no report written"; exit 1 }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.summary | ForEach-Object { Write-Host $_ }
          "### Klick-Test`n``````text`n$($r.summary -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.frozen) { Get-Content $report; exit 1 }

      - name: Start-Test der EXE (echter Start, leeres und altes beta.2-Benutzerprofil)
        run: |
          # v0.2.0-beta.1 opened only briefly on machines that had run a beta before. --self-test did not cover the real
          # start path (it builds the window from demo data with a temporary SBENCH_GUI_DIR). Here the built EXE runs
          # --self-test incl. the child --smoke-start (real start: %LOCALAPPDATA%\sbench-gui, data\ next to the EXE, real
          # core, app.exec()) with its own LOCALAPPDATA/APPDATA per scenario:
          #   leer          first start, nothing there
          #   legacy-beta2  profiles/results/logs/run index of beta.1/beta.2 (gui/tests/fixtures/legacy-beta2, anonymised)
          #   defekt        legacy-beta2 + unusable files (gui/tests/fixtures/legacy-broken): must be backed up, no crash
          # Fails on exit code <> 0, report not ok, window not visible, stray top-level windows, unexpected backups or
          # a non-empty %LOCALAPPDATA%\sbench\crash.log.
          $fx = Join-Path $PWD "tests\fixtures"
          $exe = (Get-Item dist\sbench-gui.exe).FullName
          $fail = @(); $sum = @()
          foreach ($sc in @(@{n="leer"; sets=@(); q=0; res=0}, @{n="legacy-beta2"; sets=@("legacy-beta2"); q=0; res=4},
                            @{n="defekt"; sets=@("legacy-beta2", "legacy-broken"); q=8; res=4})) {
            $root = Join-Path $env:RUNNER_TEMP "gui-start-$($sc.n)"
            $la = Join-Path $root "LocalAppData"; $ra = Join-Path $root "Roaming"; $app = Join-Path $root "app"
            New-Item -ItemType Directory -Force $la, $ra, $app | Out-Null
            Copy-Item $exe $app
            foreach ($set in $sc.sets) {
              # merge the fixture sets file by file (Copy-Item -Recurse into an existing folder does not merge reliably)
              python -c "import shutil, sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" (Join-Path $fx "$set\LocalAppData") $la
              if (Test-Path (Join-Path $fx "$set\data")) {
                python -c "import shutil, sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" (Join-Path $fx "$set\data") (Join-Path $app "data")
              }
              if ($LASTEXITCODE -ne 0) { throw "Fixture $set nicht kopiert" }
            }
            Get-ChildItem -Recurse -File $la | ForEach-Object { Write-Host "  seed: $($_.FullName.Substring($la.Length))" }
            $report = Join-Path $PWD "build\selftest-start-$($sc.n).json"
            $env:LOCALAPPDATA = $la; $env:APPDATA = $ra
            $p = Start-Process -FilePath (Join-Path $app "sbench-gui.exe") -ArgumentList @("--self-test", "--platforms", "windows", "--no-clicks", "--report", "`"$report`"") -Wait -PassThru -NoNewWindow
            $crash = Join-Path $la "sbench\crash.log"
            Write-Host "== $($sc.n): exit code $($p.ExitCode)"
            if (-not (Test-Path $report)) { $fail += "$($sc.n): kein Bericht (Exit $($p.ExitCode))"; continue }
            $r = Get-Content $report -Raw | ConvertFrom-Json
            $r.summary | ForEach-Object { Write-Host $_ }
            $sum += "[$($sc.n)]"; $sum += $r.summary
            $st = $r.start
            if ($p.ExitCode -ne 0 -or -not $r.ok) { $fail += "$($sc.n): Self-Test fehlgeschlagen (Exit $($p.ExitCode))" }
            if (-not $st -or -not $st.ok -or -not $st.visible) { $fail += "$($sc.n): echter Start fehlgeschlagen: $($st.problems -join '; ')" }
            if ($st -and @($st.quarantined).Count -ne $sc.q) { $fail += "$($sc.n): $(@($st.quarantined).Count) gesicherte Dateien, erwartet $($sc.q)" }
            if ($st -and $st.results -ne $sc.res) { $fail += "$($sc.n): $($st.results) Ergebnisse geladen, erwartet $($sc.res)" }
            if ((Test-Path $crash) -and (Get-Item $crash).Length -gt 0) {
              Write-Host "---- crash.log ----"; Get-Content $crash | Write-Host
              Copy-Item $crash (Join-Path $PWD "build\selftest-start-$($sc.n)-crash.log")
              $fail += "$($sc.n): crash.log nicht leer"
            }
            Get-ChildItem -Recurse (Join-Path $la "sbench-gui\logs") -Filter *.log | ForEach-Object { Copy-Item $_.FullName (Join-Path $PWD "build\selftest-start-$($sc.n)-$($_.Name)") }
          }
          "### Start-Test (leer / beta.2 / defekte Dateien)`n``````text`n$($sum -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY
          if ($fail) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: Absturzprotokoll der EXE (Fehler vor Qt und harter Absturz landen in crash.log)
        run: |
          foreach ($kind in @("python", "native")) {
            $la = Join-Path $env:RUNNER_TEMP "gui-crash-$kind"
            New-Item -ItemType Directory -Force $la | Out-Null
            $env:LOCALAPPDATA = $la
            $p = Start-Process -FilePath dist\sbench-gui.exe -ArgumentList @("--self-test-crash", $kind) -Wait -PassThru -NoNewWindow
            $crash = Join-Path $la "sbench\crash.log"
            Write-Host "== $kind`: exit code $($p.ExitCode)"
            if (-not (Test-Path $crash)) { throw "$kind`: crash.log fehlt" }
            $t = Get-Content $crash -Raw; Write-Host $t
            # faulthandler on Windows: "Windows fatal exception: access violation" and/or "Fatal Python error: Segmentation fault"
            $ok = if ($kind -eq "python") { $t.Contains("RuntimeError: --self-test-crash") } else { $t -match "Windows fatal exception|Fatal Python error" }
            if ($p.ExitCode -eq 0 -or -not $ok) { throw "$kind`: crash.log ohne erwarteten Eintrag oder Exit 0" }
          }

      - name: Manipulationstest (falscher Hash -> Start verweigert, Kopie wiederhergestellt)
        run: |
          $st = Join-Path $env:RUNNER_TEMP "gui-selftest"
          $bin = Get-ChildItem (Join-Path $st "data\bin\sbench-*.exe") | Select-Object -First 1
          [IO.File]::WriteAllBytes($bin.FullName, [Text.Encoding]::ASCII.GetBytes("MZ tampered"))
          $report = Join-Path $PWD "build\selftest-tampered.json"
          $p = Start-Process -FilePath (Join-Path $st "sbench-gui.exe") -ArgumentList @("--self-test", "--platforms", "offscreen", "--no-clicks", "--report", "`"$report`"") -Wait -PassThru -NoNewWindow
          $r = Get-Content $report -Raw | ConvertFrom-Json
          $r.summary | ForEach-Object { Write-Host $_ }
          # startup re-copies a mismatching file before the first launch -> self-test must pass again with the real core
          $h = (Get-FileHash $bin.FullName -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "${{ steps.info.outputs.core_sha256 }}") { throw "Kopie nicht wiederhergestellt ($h)" }
          if ($p.ExitCode -ne 0) { throw "Self-Test nach Wiederherstellung fehlgeschlagen" }

      - name: SHA-256 der getesteten EXE
        id: exehash
        run: |
          $h = (Get-FileHash dist\sbench-gui.exe -Algorithm SHA256).Hash.ToLower()
          "exe_sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "sbench-gui.exe SHA-256 $h"
          "sbench-gui.exe SHA-256 ``$h`` (getestet: Self-Test, Klick-Test, Start-Test, Absturzprotokoll)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload sbench-gui-x64 (nur sbench-gui.exe)
        uses: actions/upload-artifact@v4
        with:
          name: sbench-gui-x64
          path: gui/dist/sbench-gui.exe
          if-no-files-found: error

      - name: Upload Self-Test-Berichte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbench-gui-selftest-x64
          path: |
            gui/build/selftest-*.json
            gui/build/selftest-*.log
          if-no-files-found: ignore
