# GUI CI: lint + unit tests + self-test (mock) on Windows, schema/contract + mock E2E on Linux, and the portable
# EXE with the REAL core: job `core` (build-windows.yml via workflow_call) -> job `gui` (build-gui.yml) in the same run.
# PRs run via pull_request (no duplicate push runs for PR branches); push runs on main.
name: GUI CI

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "schema/**"
      - "tools/validate_examples.py"
      - ".github/workflows/gui-ci.yml"
      - ".github/workflows/build-gui.yml"
      - ".github/workflows/build-windows.yml"
      - "cli/**"
      - "core/**"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "gui/**"
      - "schema/**"
      - "tools/validate_examples.py"
      - ".github/workflows/gui-ci.yml"
      - ".github/workflows/build-gui.yml"
      - ".github/workflows/build-windows.yml"
      - "cli/**"
      - "core/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

# Caller group. The called build-windows.yml uses `build-windows-${{ github.workflow }}-${{ github.ref }}`, where
# github.workflow is this caller's name ("GUI CI") -> different group, no caller/callee deadlock, and it does not cancel
# the standalone "Windows-Build (sbench)" run of the same PR. build-gui.yml defines no group of its own.
concurrency:
  group: gui-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    name: windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            gui/requirements.txt
            gui/requirements-ci.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-ci.txt
          python -m pip freeze

      - name: Lint (ruff)
        run: python -m ruff check --output-format github .

      - name: Unit tests (pytest, mock core)
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m pytest -q --junitxml=build/pytest-${{ matrix.os }}.xml

      - name: Self-test from source (offscreen, mock)
        run: |
          python -m sbgui --self-test --platforms offscreen --report build/selftest-src.json
          if ($LASTEXITCODE -ne 0) { Get-Content build/selftest-src.json -ErrorAction SilentlyContinue; exit 1 }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-reports-${{ matrix.os }}-x64
          path: |
            gui/build/pytest-*.xml
            gui/build/selftest-*.json
          if-no-files-found: ignore

  # Real core from the same commit (Devend's build-windows.yml, workflow_call since #10).
  core:
    name: core
    uses: ./.github/workflows/build-windows.yml
    # build-windows.yml contains the tag-only `release` job requesting contents: write (skipped under workflow_call,
    # `if: github.workflow == ...`). GitHub validates nested job permissions statically, so the caller must allow it.
    permissions:
      contents: write

  gui:
    name: gui
    needs: core
    uses: ./.github/workflows/build-gui.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.core.outputs.version }}
      core_artifact: ${{ needs.core.outputs.cli_artifact_x64 }}

  linux:
    name: linux (schema + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            gui/requirements.txt
            gui/requirements-ci.txt

      - name: Qt runtime libraries (offscreen platform)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Schemas + contract examples (tools/validate_examples.py)
        working-directory: .
        run: python tools/validate_examples.py

      - name: Contract check of demo data and profiles (mock output)
        run: |
          python tools/check_mock.py demo/*.json demo/progress.jsonl profiles/four-corners.json profiles/mix-60-40-example.json
          # oltp-mixed.json must be rejected (raw disk write without allow_destructive -> E_DESTRUCTIVE_NOT_ALLOWED)
          if python tools/check_mock.py profiles/oltp-mixed.json; then echo "oltp-mixed.json unexpectedly valid"; exit 1; fi

      - name: Lint + unit tests
        run: |
          python -m ruff check --output-format github .
          python -m pytest -q

      - name: E2E against the mock (exit 4/2/3, re-attach, support ZIP with --anonymize)
        env:
          SBENCH_SHOT_DIR: ${{ github.workspace }}/gui/build/e2e
        run: |
          mkdir -p build
          python tools/live_qprocess_check.py | tee build/e2e-report.json

      - name: Self-test (offscreen)
        run: python -m sbgui --self-test --platforms offscreen --report build/selftest-linux.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-reports-linux
          path: |
            gui/build/e2e-report.json
            gui/build/selftest-linux.json
            gui/build/e2e/*.png
          if-no-files-found: ignore
