# README-Anleitung: ECHTE Screenshots der aktuellen GUI mit dem ECHTEN Kern auf windows-2022.
# core (build-windows.yml) -> gui (build-gui.yml, sbench-gui.exe mit eingebettetem Kern) -> guide:
#   sbench-gui.exe --guide (sbgui/guide.py) startet die portable EXE aus C:\Tools\sbench, Plattform-Plugin `windows`,
#   Fenster 1440x900, 100 % Skalierung: echte info, echte Storage-Läufe auf einer Testdatei (ohne Admin-Zwang),
#   Live-Ansicht während der Messung, Stopp, Vergleich zweier echter Läufe, Support-Paket (--all, anonymisiert).
#   Dazu Explorer-Ordner nach dem ersten Start und ein Konsolenfenster mit echten CLI-Aufrufen (tools/capture_window.py).
# Ergebnis: Artifact `guide-screenshots` (PNG + report.json). Übernahme nach docs/img/guide/ per Commit (siehe docs/entwicklung.md).
name: GUI screenshots (README-Anleitung)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gui/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

# Caller group; the called build-windows.yml uses build-windows-<this workflow name>-<ref> -> no deadlock/cancel with GUI CI.
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  gui:
    needs: core
    uses: ./.github/workflows/build-gui.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.core.outputs.version }}
      core_artifact: ${{ needs.core.outputs.cli_artifact_x64 }}

  guide:
    name: Screenshots (windows-2022, echter Kern)
    needs: [core, gui]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      APP: C:\Tools\sbench
      SHOTS: ${{ github.workspace }}\guide-out
    steps:
      - uses: actions/checkout@v4

      - name: GUI-EXE laden (sbench-gui-x64) nach C:\Tools\sbench
        uses: actions/download-artifact@v4
        with:
          name: sbench-gui-x64
          path: C:\Tools\sbench

      - name: Kern-CLI laden (sbench-cli-x64)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.core.outputs.cli_artifact_x64 }}
          path: ${{ runner.temp }}\cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: gui/requirements-ci.txt

      - name: PySide6 für das Fenster-Capture-Tool
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials==6.12.0"

      - name: Bildschirmauflösung 1920x1080 (Fenster 1440x900 muss ganz sichtbar sein)
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep 2
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Anleitung aufnehmen (sbench-gui.exe --guide)
        run: |
          New-Item -ItemType Directory -Force $env:SHOTS, D:\sbench | Out-Null
          Get-ChildItem $env:APP
          $p = Start-Process -FilePath "$env:APP\sbench-gui.exe" -WorkingDirectory $env:APP -Wait -PassThru `
               -ArgumentList @("--guide", "`"$env:SHOTS`"", "--size", "1440x900", "--guide-target", "D:\sbench\testdatei.dat")
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path "$env:SHOTS\report.json") { Get-Content "$env:SHOTS\report.json" } else { throw "kein report.json" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Explorer-Ordner nach dem ersten Start (01_download)
        run: |
          Start-Process explorer.exe $env:APP
          python gui/tools/capture_window.py --title "sbench" --class CabinetWClass --size 960x520 --out "$env:SHOTS\01_download.png"
          Get-Process explorer -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -like "*sbench*" | ForEach-Object { $_.CloseMainWindow() | Out-Null }

      - name: CLI im Konsolenfenster (07_cli)
        run: |
          Copy-Item "${{ runner.temp }}\cli\sbench.exe" $env:APP
          $job = @{ schema = "sb-job/1"; name = "cli-beispiel"; tests = @(@{ type = "storage"; name = "4K random lesen";
                    targets = @(@{ path = "D:\sbench\cli.dat"; kind = "file"; file_size = "256MiB" }); workers = 1; queue_depth = 8;
                    warmup_s = 1; duration_s = 5; cache = "unbuffered";
                    access_specs = @(@{ weight = 100; block_size = "4KiB"; read_pct = 100; random_pct = 100; align = "4KiB" }) }) }
          $job | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM D:\sbench\job.json
          @(
            '@prompt $P$G',
            '@cd /d C:\Tools\sbench',
            'sbench version',
            'sbench --data-dir C:\Tools\sbench\data run --job D:\sbench\job.json --out D:\sbench\ergebnis.json',
            '@echo Exit-Code %ERRORLEVEL%',
            'sbench --data-dir C:\Tools\sbench\data bundle --out D:\sbench\support.zip --all --anonymize',
            '@echo Exit-Code %ERRORLEVEL%',
            '@type nul > D:\sbench\cli-done.txt'
          ) | Set-Content -Encoding ascii D:\sbench\cli-demo.cmd
          Start-Process cmd.exe -ArgumentList '/k', 'title sbench CLI & mode con cols=118 lines=34 & D:\sbench\cli-demo.cmd'
          python gui/tools/capture_window.py --title "sbench CLI" --wait-file D:\sbench\cli-done.txt --timeout 60 --out "$env:SHOTS\07_cli.png"
          Get-Content D:\sbench\ergebnis.json -TotalCount 5

      - name: Upload guide-screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-screenshots
          path: guide-out
          if-no-files-found: error
